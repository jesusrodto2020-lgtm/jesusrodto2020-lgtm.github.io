<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel Operador</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    :root { --bg:#0f1724; --text:#ffffff; }

    html,body{
      height:100%; margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
      background:linear-gradient(180deg,#071025 0%,#0f1724 100%);
      color:var(--text);
      display:flex; align-items:center; justify-content:center;
    }

    .center{
      display:flex; flex-direction:column;
      gap:30px;
      align-items:center; justify-content:center;
      width:100%; max-width:700px; padding:24px;
    }

    .big-btn{
      appearance:none;
      border:0;
      border-radius:28px;
      padding:22px 28px;
      font-size:26px;
      font-weight:700;
      width:86vw; max-width:220px;
      height:86vw; max-height:220px;
      color:white;
      box-shadow:0 12px 30px rgba(0,0,0,.22), inset 0 -6px 12px rgba(0,0,0,.12);
      display:flex; align-items:center; justify-content:center;
      touch-action:manipulation; user-select:none;
      cursor:pointer;
    }

    .big-btn:active{
      transform:scale(.96);
    }

    /* Botón rojo */
    .btn-error{
      background:red;
    }

    /* Botón verde */
    .btn-bien{
      background:green;
    }


    /* Estilos del campo numérico */
    #numeroInput{
      width:200px;
      padding:14px;
      font-size:24px;
      border-radius:12px;
      border:none;
      text-align:center;
      outline:none;
      box-shadow:0 6px 18px rgba(0,0,0,.25);
    }

    #sendNumero{
      padding:14px 30px;
      font-size:22px;
      border-radius:16px;
      border:none;
      background:#1565ff;
      color:white;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 6px 20px rgba(0,0,0,.22);
    }

    #sendNumero:active{
      transform:scale(.96);
    }
  </style>
</head>

<body>
  
  <div class="center">

    <!-- FILA DE NÚMERO + BOTÓN ENVIAR -->
    <div style="display:flex; gap:20px; align-items:center;">
      <input id="numeroInput"  placeholder="Número">

      <button id="sendNumero">Enviar</button>
    </div>

    <!-- FILA DE BOTONES CORRECTO / INCORRECTO -->
    <div style="display:flex; gap:40px; margin-top:10px;">
      <button id="sendBien" class="big-btn btn-bien">Correcto</button>
      <button id="sendError" class="big-btn btn-error">Incorrecto</button>
    </div>
    
  </div>

  

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC-gy5r8gCPL1mJk6JlXfLmwAW_gtoaYkw",
      authDomain: "rondapreguntas.firebaseapp.com",
      databaseURL: "https://rondapreguntas-default-rtdb.firebaseio.com",
      projectId: "rondapreguntas",
      storageBucket: "rondapreguntas.firebasestorage.app",
      messagingSenderId: "96196940602",
      appId: "1:96196940602:web:d0699eafd781c721f47603",
      measurementId: "G-1695HYEX62"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Botón Error → envía "error"
    document.getElementById("sendError").addEventListener("click", () => {
      db.ref("chat/mensaje").set("error");
    });

    // Botón Bien → envía "bien"
    document.getElementById("sendBien").addEventListener("click", () => {
      db.ref("chat/mensaje").set("bien");
    });


    // Enviar número
    document.getElementById("sendNumero").addEventListener("click", () => {
      const n = document.getElementById("numeroInput").value;

      if(n === ""){
        alert("Ingresa un número antes de enviar.");
        return;
      }

      db.ref("chat/mensaje").set(n);
    });

    
  </script>
</body>
</html>
