<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Botón Hora (Responsive)</title>
  <style>
    :root{--bg:#0f1724;--btn:#e11d48;--text:#ffffff}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
    body{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#071025 0%,#0f1724 100%);color:var(--text)}
    .container{width:100%;max-width:700px;padding:24px;box-sizing:border-box}
    .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh}
    .big-btn{
      appearance:none;border:0;border-radius:28px;padding:22px 28px;font-size:26px;font-weight:700;line-height:1.05;
      width:86vw;max-width:420px;height:86vw;max-height:420px;display:flex;align-items:center;justify-content:center;
      background:var(--btn);color:white;box-shadow:0 12px 30px rgba(225,29,72,.22), inset 0 -6px 12px rgba(0,0,0,.12);
      touch-action:manipulation;user-select:none
    }
    .big-btn:active{transform:scale(.995)}
    .time-box{margin-top:20px;background:rgba(255,255,255,0.03);padding:14px 16px;border-radius:12px;min-width:86vw;max-width:420px;text-align:center}
    .time-line{font-family:monospace;font-size:16px}
    .hint{margin-top:10px;font-size:13px;opacity:.8}
    @media(min-width:560px){
      .center{min-height:70vh}
      .big-btn{width:360px;height:360px;font-size:30px}
      .time-box{min-width:360px}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="center">
      <button id="timeBtn" class="big-btn" aria-live="polite">Toca aquí</button>
      <div id="timeBox" class="time-box" aria-hidden="true">
        <div id="timeLine" class="time-line">Aún no has presionado el botón.</div>
        <div class="hint">Se muestra la hora exacta (incluye microsegundos estimados si el navegador lo permite).</div>
      </div>
    </div>
  </div>

  <script>
    const perfNow = performance.now();
    const epochNowMs = Date.now();
    const baseMs = epochNowMs - perfNow;

    function pad(n, digits=2){ return String(n).padStart(digits,'0'); }

    function formatHighResTime(tsMs){
      const integerMs = Math.floor(tsMs);
      const date = new Date(integerMs);

      const hours = pad(date.getHours());
      const minutes = pad(date.getMinutes());
      const seconds = pad(date.getSeconds());
      const milliseconds = pad(date.getMilliseconds(),3);

      const fracMs = tsMs - integerMs;
      const microseconds = Math.round(fracMs * 1000);
      const microStr = String(microseconds).padStart(3,'0');

      const y = date.getFullYear();
      const mo = pad(date.getMonth()+1);
      const d = pad(date.getDate());

      return `${y}-${mo}-${d} ${hours}:${minutes}:${seconds}.${milliseconds} ${microStr}μs`;
    }

    function getHighResTimestampMs(){
      return baseMs + performance.now();
    }

    const btn = document.getElementById('timeBtn');
    const timeLine = document.getElementById('timeLine');
    const timeBox = document.getElementById('timeBox');

    function showTime(event){
      if (event) event.preventDefault && event.preventDefault();

      const ts = getHighResTimestampMs();
      const formatted = formatHighResTime(ts);

      timeLine.textContent = formatted;
      timeBox.setAttribute('aria-hidden','false');

      btn.animate(
        [{ transform: 'scale(1)' },{ transform: 'scale(.98)' },{ transform: 'scale(1)' }],
        { duration:240, easing:'ease-out' }
      );
    }

    let touched = false;
    btn.addEventListener('touchstart', (e)=>{ touched = true; showTime(e); }, {passive:false});
    btn.addEventListener('click', (e)=>{ if (!touched) showTime(e); touched = false; });

    btn.addEventListener('keydown',(e)=>{ if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showTime(); } });

    if (typeof performance === 'undefined' || typeof performance.now !== 'function'){
      console.warn('performance.now() no disponible — la resolución será milisegundos (no microsegundos).');
    }
  </script>
</body>
</html>
