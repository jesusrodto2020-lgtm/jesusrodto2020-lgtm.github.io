<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Receiver</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

 <style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;   /* Centrar horizontal */
    align-items: center;       /* Centrar vertical */
    background: #f5f5f5;
    font-family: sans-serif;
  }

  #pregunta {
  display: flex;
  flex-direction: column;   /* Acomoda uno abajo de otro */
  justify-content: center;
  align-items: center;
  gap: 20px;                /* Separación entre textos */
    font-size: 26px;
  color: #444;
  background: #ddd;
  padding: 15px;
    margin: 30px;
  border-radius: 10px;
  text-align: center;
}

#respuesta {
  font-size: 26px;
  color: #444;
  background: #ddd;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}
</style>
  

  
</head>
  
  
 

  
<!-- Imagen de error superpuesta -->
<div id="errorOverlay" 
     style="display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            z-index:9999;
            display:flex;
            justify-content:center;
            align-items:center;">
  <img src="https://images.vexels.com/media/users/3/340637/isolated/preview/a4a2816ab9c5c098dc0858804e8faed3-circulo-rojo-con-una-x-en-el-medio.png" 
       alt="error" 
       style="width:180px; filter:drop-shadow(0 0 10px black);">
</div>


  <!-- Imagen de bien superpuesta -->
<div id="bienOverlay" 
     style="display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            z-index:9999;
            display:flex;
            justify-content:center;
            align-items:center;">
  <img src="https://marketplace.canva.com/yaTUs/MAE86YyaTUs/1/tl/canva-circle-with-checkmark-icon-MAE86YyaTUs.png" 
       alt="error" 
       style="width:180px; filter:drop-shadow(0 0 10px black);">
</div>

  

 <div id="contenedor">
  <div id="pregunta">Esperando mensaje...</div>
  <div id="respuesta">Segundo texto aquí...</div>
</div>

  <script>
    // MISMO CONFIG QUE EN sender.html
     const firebaseConfig = {
      apiKey: "AIzaSyC-gy5r8gCPL1mJk6JlXfLmwAW_gtoaYkw",
      authDomain: "rondapreguntas.firebaseapp.com",
      databaseURL: "https://rondapreguntas-default-rtdb.firebaseio.com",
      projectId: "rondapreguntas",
      storageBucket: "rondapreguntas.firebasestorage.app",
      messagingSenderId: "96196940602",
      appId: "1:96196940602:web:d0699eafd781c721f47603",
      measurementId: "G-1695HYEX62"
    };
    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();

    // Escucha en TIEMPO REAL
    db.ref("chat/mensaje").on("value", (snapshot) => {
  const msg = snapshot.val();
  const box = document.getElementById("pregunta");
  const boxRespu = document.getElementById("respuesta");
      
  // Mostrar el texto normalmente
      box.innerText = "LISTOOOOOOS?";
  boxRespu.innerText = msg;

  // Si el mensaje es "azul", cambiar fondo 5 segundos
  if (msg && msg.toLowerCase() === "azul") {
    document.body.style.background = "blue";

    setTimeout(() => {
      document.body.style.background = ""; // Regresa al color original
    }, 5000);
  }
      if (msg && msg.toLowerCase() === "rojo") {
    document.body.style.background = "red";

    setTimeout(() => {
      document.body.style.background = ""; // Regresa al color original
    }, 5000);
  }
      if (msg && msg.toLowerCase() === "verde") {
    document.body.style.background = "green";

    setTimeout(() => {
      document.body.style.background = ""; // Regresa al color original
    }, 5000);
  }

       if (msg && msg.toLowerCase() === "naranja") {
    document.body.style.background = "orange";

    setTimeout(() => {
      document.body.style.background = ""; // Regresa al color original
    }, 5000);
  }



      // Mostrar tacha de error 2 segundos
if (msg && msg.toLowerCase() === "error") {
  const overlay = document.getElementById("errorOverlay");
  overlay.style.display = "flex";

  setTimeout(() => {
    overlay.style.display = "none";
  }, 2000);
}


       // Mostrar palomita de correcto 2 segundos
if (msg && msg.toLowerCase() === "bien") {
  const overlay2 = document.getElementById("bienOverlay");
  overlay2.style.display = "flex";

  setTimeout(() => {
    overlay2.style.display = "none";
  }, 2000);
}

//Pregunta 1
      if (msg && msg.toLowerCase() === "1") {
  box.innerText = "HOLAA";
}


      
});
  </script>
</body>
</html>
