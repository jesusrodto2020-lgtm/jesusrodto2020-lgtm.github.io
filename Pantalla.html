<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Receiver</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">

<!-- Imagen de error superpuesta -->
<div id="errorOverlay" 
     style="display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            z-index:9999;
            display:flex;
            justify-content:center;
            align-items:center;">
  <img src="https://img.freepik.com/psd-premium/simbolo-x-aislado_23-2150500353.jpg" 
       alt="error" 
       style="width:180px; filter:drop-shadow(0 0 10px black);">
</div>
  
  <h2>Texto recibido:</h2>
  

  <div id="resultado" style="font-size: 22px; padding: 10px; background: #eee;">
    Esperando mensaje...
  </div>

  <script>
    // MISMO CONFIG QUE EN sender.html
     const firebaseConfig = {
      apiKey: "AIzaSyC-gy5r8gCPL1mJk6JlXfLmwAW_gtoaYkw",
      authDomain: "rondapreguntas.firebaseapp.com",
      databaseURL: "https://rondapreguntas-default-rtdb.firebaseio.com",
      projectId: "rondapreguntas",
      storageBucket: "rondapreguntas.firebasestorage.app",
      messagingSenderId: "96196940602",
      appId: "1:96196940602:web:d0699eafd781c721f47603",
      measurementId: "G-1695HYEX62"
    };
    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();

    // Escucha en TIEMPO REAL
    db.ref("chat/mensaje").on("value", (snapshot) => {
  const msg = snapshot.val();
  const box = document.getElementById("resultado");

  // Mostrar el texto normalmente
  box.innerText = msg;

  // Si el mensaje es "azul", cambiar fondo 5 segundos
  if (msg && msg.toLowerCase() === "azul") {
    document.body.style.background = "blue";

    setTimeout(() => {
      document.body.style.background = ""; // Regresa al color original
    }, 5000);
  }
      if (msg && msg.toLowerCase() === "rojo") {
    document.body.style.background = "red";

    setTimeout(() => {
      document.body.style.background = ""; // Regresa al color original
    }, 5000);
  }
      if (msg && msg.toLowerCase() === "verde") {
    document.body.style.background = "green";

    setTimeout(() => {
      document.body.style.background = ""; // Regresa al color original
    }, 5000);
  }

       if (msg && msg.toLowerCase() === "naranja") {
    document.body.style.background = "orange";

    setTimeout(() => {
      document.body.style.background = ""; // Regresa al color original
    }, 5000);
  }



      // Mostrar tacha de error 2 segundos
if (msg && msg.toLowerCase() === "error") {
  const overlay = document.getElementById("errorOverlay");
  overlay.style.display = "flex";

  setTimeout(() => {
    overlay.style.display = "none";
  }, 2000);
}
});
  </script>
</body>
</html>
