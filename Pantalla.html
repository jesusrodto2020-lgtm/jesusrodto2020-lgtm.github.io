      function escribirTexto(texto, velocidad = 40) {
    const div = document.getElementById("respuesta");
    div.innerHTML = ""; // Limpia el contenido
    let index = 0;

    function escribir() {
        if (index < texto.length) {
            div.innerHTML += texto.charAt(index);
            index++;
            setTimeout(escribir, velocidad);
        }
    }

    escribir();
      }
