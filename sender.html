<!doctype html>
<html>
<body>
  <button backcolor="red" id="btn">ENVIAR MENSAJE</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-gy5r8gCPL1mJk6JlXfLmwAW_gtoaYkw",
      authDomain: "rondapreguntas.firebaseapp.com",
      databaseURL: "https://rondapreguntas-default-rtdb.firebaseio.com",
      projectId: "rondapreguntas",
      storageBucket: "rondapreguntas.firebasestorage.app",
      messagingSenderId: "96196940602",
      appId: "1:96196940602:web:d0699eafd781c721f47603",
      measurementId: "G-1695HYEX62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById("btn").addEventListener("click", () => {
      console.log("Botón presionado, enviando...");
      set(ref(db, "mensaje"), {
        texto: "¡El botón fue presionado!"
      })
      .then(() => console.log("Mensaje enviado"))
      .catch(err => console.error("Error:", err));
    });
  </script>
</body>
</html>
