
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sender</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>Enviar texto</h2>

  <input id="mensaje" type="text" placeholder="Escribe algo" style="width: 200px; padding: 6px;">
  <button onclick="enviar()">Enviar</button>

  <script>
    // TU CONFIG
     const firebaseConfig = {
      apiKey: "AIzaSyC-gy5r8gCPL1mJk6JlXfLmwAW_gtoaYkw",
      authDomain: "rondapreguntas.firebaseapp.com",
      databaseURL: "https://rondapreguntas-default-rtdb.firebaseio.com",
      projectId: "rondapreguntas",
      storageBucket: "rondapreguntas.firebasestorage.app",
      messagingSenderId: "96196940602",
      appId: "1:96196940602:web:d0699eafd781c721f47603",
      measurementId: "G-1695HYEX62"
    };
    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();

    function enviar() {
      const texto = document.getElementById("mensaje").value;
      db.ref("chat/mensaje").set(texto);  // <-- SE PUBLICA
    }
  </script>
</body>
</html>
